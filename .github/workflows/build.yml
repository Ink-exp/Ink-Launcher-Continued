name: Build Ink Launcher APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate Compiled APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          echo "APK_FILE=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at: $APK_PATH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-Beta
          name: "Ink Launcher v1.0.0-Beta"
          body: |
            ### 🎮 Ink Launcher - Official Beta Release
            
            **What's New in this Build:**
            * **Authentic Minecraft Client HUD:** Integrated obsidian charcoal card drawer with green accents.
            * **Real Game Logic:** Live `options.txt` synchronization for FOV and FPS limits.
            * **Performance & Overlays:** FPS Boost mode and dynamic touch control triggers.
            * **Floating Overlay Engine:** Clean, drag-enabled floating pill service.
          draft: false
          prerelease: true
          files: ${{ env.APK_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
