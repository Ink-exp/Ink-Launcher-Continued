name: Build Ink Launcher APK

on:
  push:
    branches: [ "**" ] # This ensures it runs on any branch you save to
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  build:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.1'

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Locate APK File
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          echo "APK_FILE=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at: $APK_PATH"

      # THIS IS THE NEW STEP: It saves the file directly to your Actions page
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ink-Launcher-APK
          path: ${{ env.APK_FILE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: "v1.0.0-Build-${{ github.run_number }}"
          name: "Ink Launcher Beta (Build ${{ github.run_number }})"
          draft: false
          prerelease: true
          files: ${{ env.APK_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
