name: Build Ink Launcher APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Engine
        uses: gradle/actions/setup-gradle@v3

      - name: Compile Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Locate Compiled APK File
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          echo "APK_FILE=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at: $APK_PATH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-Beta
          name: "Ink Launcher v1.0.0-Beta"
          body: |
            ### 🎮 Ink Launcher - Official Beta Release
            
            **Included Engine Upgrades:**
            * Authentic obsidian charcoal client HUD with green accent highlights
            * Live `options.txt` sync for FOV and FPS limits
            * Dynamic touch control toggles and Performance Mode
            * Floating window service with slide-out drawer
          draft: false
          prerelease: true
          files: ${{ env.APK_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
